services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: adm1n
      POSTGRES_PASSWORD: adm1n
      POSTGRES_DB: aurelius
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adm1n -d aurelius"]
      interval: 3s
      timeout: 3s
      retries: 5

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"

  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    ports:
      - "8000:8000"
      - "9000:9000"
    environment:
      CONSUL_HTTP_ADDR: consul:8500
    depends_on:
      - consul
      - backend-get-1
      - backend-get-2
      - backend-post-1
      - backend-post-2
      - backend-put-1
      - backend-put-2

  api-service:
    build: ./api-service
    container_name: api-service
    environment:
      GATEWAY_GRPC_ADDR: nginx-gateway:9000
    depends_on:
      - nginx-gateway

  backend-get-1: &backend-base
    build: ./backend
    container_name: backend-get-1
    environment: &backend-env
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: adm1n
      DB_PASSWORD: adm1n
      DB_NAME: aurelius
      CONSUL_HTTP_ADDR: consul:8500
      GATEWAY_GRPC_ADDR: nginx-gateway:9000
      INSTANCE_ID: backend-get-1
      ROLE: get
      DEBUG_WORKER_ID: 1
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started

  backend-get-2:
    <<: *backend-base
    container_name: backend-get-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-get-2
      ROLE: get
      DEBUG_WORKER_ID: 2

  backend-post-1:
    <<: *backend-base
    container_name: backend-post-1
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-post-1
      ROLE: post
      DEBUG_WORKER_ID: 3

  backend-post-2:
    <<: *backend-base
    container_name: backend-post-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-post-2
      ROLE: post
      DEBUG_WORKER_ID: 4

  backend-put-1:
    <<: *backend-base
    container_name: backend-put-1
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-put-1
      ROLE: put
      DEBUG_WORKER_ID: 5

  backend-put-2:
    <<: *backend-base
    container_name: backend-put-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-put-2
      ROLE: put
      DEBUG_WORKER_ID: 6