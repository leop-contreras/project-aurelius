services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: adm1n
      POSTGRES_PASSWORD: adm1n
      POSTGRES_DB: aurelius
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adm1n -d aurelius"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: backend/
    container_name: backend-1
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: adm1n
      DB_PASSWORD: adm1n
      DB_NAME: aurelius
    depends_on:
      db:
        condition: service_healthy