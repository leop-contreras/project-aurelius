services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: adm1n
      POSTGRES_PASSWORD: adm1n
      POSTGRES_DB: aurelius
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adm1n -d aurelius"]
      interval: 3s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  events-audit-1: &events-base
    build: ./events-service
    container_name: events-audit-1
    environment: &events-env
      KAFKA_BROKER: kafka:9092
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: adm1n
      DB_PASSWORD: adm1n
      DB_NAME: aurelius
      ROLE: audit
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  events-audit-2:
    <<: *events-base
    container_name: events-audit-2

  events-history-1:
    <<: *events-base
    container_name: events-history-1
    environment:
      <<: *events-env
      ROLE: history

  events-history-2:
    <<: *events-base
    container_name: events-history-2
    environment:
      <<: *events-env
      ROLE: history

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"

  nginx-gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    ports:
      - "8000:8000"
      - "9000:9000"
    environment:
      CONSUL_HTTP_ADDR: consul:8500
    depends_on:
      - consul
      - backend-get-1
      - backend-get-2
      - backend-post-1
      - backend-post-2
      - backend-put-1
      - backend-put-2

  api-service:
    build: ./api-service
    container_name: api-service
    environment:
      GATEWAY_GRPC_ADDR: nginx-gateway:9000
    depends_on:
      - nginx-gateway

  backend-get-1: &backend-base
    build: ./backend
    container_name: backend-get-1
    environment: &backend-env
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: adm1n
      DB_PASSWORD: adm1n
      DB_NAME: aurelius
      CONSUL_HTTP_ADDR: consul:8500
      GATEWAY_GRPC_ADDR: nginx-gateway:9000
      KAFKA_BROKER: kafka:9092
      DOCKER_SOCKET: /var/run/docker.sock
      MAX_CONTAINERS: 5
      INSTANCE_ID: backend-get-1
      ROLE: get
      DEBUG_WORKER_ID: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_started

  backend-get-2:
    <<: *backend-base
    container_name: backend-get-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-get-2
      ROLE: get
      DEBUG_WORKER_ID: 2

  backend-post-1:
    <<: *backend-base
    container_name: backend-post-1
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-post-1
      ROLE: post
      DEBUG_WORKER_ID: 3

  backend-post-2:
    <<: *backend-base
    container_name: backend-post-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-post-2
      ROLE: post
      DEBUG_WORKER_ID: 4

  backend-put-1:
    <<: *backend-base
    container_name: backend-put-1
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-put-1
      ROLE: put
      DEBUG_WORKER_ID: 5

  backend-put-2:
    <<: *backend-base
    container_name: backend-put-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-put-2
      ROLE: put
      DEBUG_WORKER_ID: 6