syntax = "proto3";

package aurelius;
option go_package = "main/proto_gen";

service InstanceService {
  rpc GetInstance(GetInstanceRequest) returns (Instance);
  rpc ListInstances(ListInstancesRequest) returns (InstanceList);
  rpc CreateInstance(CreateInstanceRequest) returns (Instance);
  rpc UpdateStatus(UpdateStatusRequest) returns (Instance);
  rpc RenewInstance(RenewInstanceRequest) returns (Instance);
  rpc ListChallenges(ListChallengesRequest) returns (ChallengeList);
}

message Instance {
  int32 id = 1;
  string name = 2;
  string status = 3;
  int32 port = 4;
  string expires_at = 5;
  int32 renew_count = 6;
  int32 challenge_id = 7;
}

message GetInstanceRequest {
  int32 id = 1;
}

message ListInstancesRequest {}

message InstanceList {
  repeated Instance instances = 1;
}

message CreateInstanceRequest {
  int32 challenge_id = 1;
}

message UpdateStatusRequest {
  int32 id = 1;
  string status = 2;
}

message RenewInstanceRequest {
  int32 id = 1;
}

message Challenge {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

message ListChallengesRequest {}

message ChallengeList {
  repeated Challenge challenges = 1;
}
