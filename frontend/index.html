<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Frontend</title>
</head>
<body>

<h1>Control panel</h1>

<h2>Status</h2>
<pre id="status">loading...</pre>

<h2>Instances</h2>
<table border="1" cellpadding="4">
  <thead>
    <tr><th>id</th><th>name</th><th>status</th><th>link</th><th>expires in</th><th>renews</th><th></th></tr>
  </thead>
  <tbody id="instances"></tbody>
</table>

<h2>Read</h2>
<input id="getId" type="number" value="1">
<button onclick="doGet()">Read</button>

<h2>Create</h2>
<input id="newName" type="text" value="instance1">
<button onclick="doCreate()">Create</button>

<h2>Update status</h2>
<input id="updateId" type="number" value="1">
<select id="updateStatus">
  <option value="inactive">inactive</option>
  <option value="active">active</option>
</select>
<button onclick="doUpdate()">Update</button>

<h2>Response</h2>
<pre id="output">-</pre>

<h2>Workers that answered</h2>
<pre id="workers">-</pre>

<script>
const API = "http://localhost:8000";

const PATH_GET    = "/instance";
const PATH_CREATE = "/instance/create";
const PATH_UPDATE = "/instance/update-status";
const PATH_LIST   = "/instances";
const PATH_RENEW  = "/instance/renew";

let worker = [];
let instances = [];

async function send(method, path, body) {
  try {
    const opts = { method: method };
    if (body) {
      opts.headers = { "Content-Type": "application/json" };
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(API + path, opts);
    const workerId  = res.headers.get("X-Worker-ID");
    const text = await res.text();

    worker.push(workerId  || "?");
    if (worker.length > 20) worker.shift();
    document.getElementById("workers").textContent = worker.join("  ");

    document.getElementById("output").textContent =
      method + " " + path + "\n" +
      "status: " + res.status + "\n" +
      "worker: " + (workerId || "NOT EXPOSED") + "\n\n" + text;
  } catch (e) {
    worker.push("ERR");
    document.getElementById("workers").textContent = worker.join("  ");
    document.getElementById("output").textContent = "FAILED: " + e;
  }
}

function doGet() {
  send("GET", PATH_GET + "?id=" + document.getElementById("getId").value);
}

function doCreate() {
  send("POST", PATH_CREATE, { name: document.getElementById("newName").value });
}

function doUpdate() {
  send("PUT", PATH_UPDATE, {
    id: Number(document.getElementById("updateId").value),
    status: document.getElementById("updateStatus").value
  });
}

function doRenew(id) {
  send("PUT", PATH_RENEW, { id: id });
}

function expiresIn(instance) {
  if (instance.status !== "active") return "-";
  const seconds = Math.max(0, Math.round((new Date(instance.expires_at) - Date.now()) / 1000));
  return Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
}

function renderInstances() {
  document.getElementById("instances").innerHTML = instances.map(function (instance) {
    const active = instance.status === "active";
    const url = "http://localhost:" + instance.port;
    return "<tr>" +
      "<td>" + instance.id + "</td>" +
      "<td>" + instance.name + "</td>" +
      "<td>" + instance.status + "</td>" +
      "<td>" + (active ? '<a href="' + url + '" target="_blank">' + url + "</a>" : "-") + "</td>" +
      "<td>" + expiresIn(instance) + "</td>" +
      "<td>" + instance.renew_count + "/5</td>" +
      "<td>" + (active ? '<button onclick="doRenew(' + instance.id + ')">Renew</button>' : "") + "</td>" +
      "</tr>";
  }).join("");
}

async function loadInstances() {
  try {
    const res = await fetch(API + PATH_LIST);
    if (res.ok) instances = await res.json();
  } catch (e) {
    instances = [];
  }
  renderInstances();
}
loadInstances();
setInterval(loadInstances, 2000);
setInterval(renderInstances, 1000);

async function areYouAlive() {
  try {
    const res = await fetch(API + "/status");
    document.getElementById("status").textContent = await res.text();
  } catch (e) {
    document.getElementById("status").textContent = "middleware unreachable";
  }
}
areYouAlive();
setInterval(areYouAlive, 2000);
</script>

</body>
</html>
