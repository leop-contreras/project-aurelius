<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Frontend</title>
</head>
<body>

<h1>Control panel</h1>

<h2>Status</h2>
<pre id="status">loading...</pre>

<h2>Read</h2>
<input id="getId" type="number" value="1">
<button onclick="doGet()">Read</button>

<h2>Create</h2>
<input id="newName" type="text" value="instance1">
<button onclick="doCreate()">Create</button>

<h2>Update status</h2>
<input id="updateId" type="number" value="1">
<input id="updateStatus" type="text" value="active">
<button onclick="doUpdate()">Update</button>

<h2>Response</h2>
<pre id="output">-</pre>

<h2>Workers that answered</h2>
<pre id="workers">-</pre>

<script>
const API = "http://localhost:8000";

const PATH_GET    = "/instance";
const PATH_CREATE = "/instance/create";
const PATH_UPDATE = "/instance/update-status";

let worker = [];

async function send(method, path, body) {
  try {
    const opts = { method: method };
    if (body) {
      opts.headers = { "Content-Type": "application/json" };
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(API + path, opts);
    const workerId  = res.headers.get("X-Worker-ID");
    const text = await res.text();

    worker.push(workerId  || "?");
    if (worker.length > 20) worker.shift();
    document.getElementById("workers").textContent = worker.join("  ");

    document.getElementById("output").textContent =
      method + " " + path + "\n" +
      "status: " + res.status + "\n" +
      "worker: " + (workerId || "NOT EXPOSED") + "\n\n" + text;
  } catch (e) {
    worker.push("ERR");
    document.getElementById("workers").textContent = worker.join("  ");
    document.getElementById("output").textContent = "FAILED: " + e;
  }
}

function doGet() {
  send("GET", PATH_GET + "?id=" + document.getElementById("getId").value);
}

function doCreate() {
  send("POST", PATH_CREATE, { name: document.getElementById("newName").value });
}

function doUpdate() {
  send("PUT", PATH_UPDATE, {
    id: Number(document.getElementById("updateId").value),
    status: document.getElementById("updateStatus").value
  });
}

async function areYouAlive() {
  try {
    const res = await fetch(API + "/status");
    document.getElementById("status").textContent = await res.text();
  } catch (e) {
    document.getElementById("status").textContent = "middleware unreachable";
  }
}
areYouAlive();
setInterval(areYouAlive, 2000);
</script>

</body>
</html>
