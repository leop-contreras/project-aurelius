events {}

http {
    upstream get_pool {
        server backend-get-1:8080 max_fails=3 fail_timeout=30s;
        server backend-get-2:8080 max_fails=3 fail_timeout=30s;
    }

    upstream post_pool {
        server backend-post-1:8080 max_fails=3 fail_timeout=30s;
        server backend-post-2:8080 max_fails=3 fail_timeout=30s;
    }

    upstream put_pool {
        server backend-put-1:8080 max_fails=3 fail_timeout=30s;
        server backend-put-2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;
        
        # This headers replicate the mechanism we used on Golang for this work.
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers X-Worker-ID always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /instance/update-status {
            proxy_pass http://put_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /instance/create {
            proxy_pass http://post_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /instance {
            proxy_pass http://get_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            return 200 "OK";
        }

        location /status {
            stub_status;
        }
    }
}
